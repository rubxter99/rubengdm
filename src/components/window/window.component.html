
<!-- Title Bar -->
<div 
  class="h-8 bg-[--titlebar-bg] flex-shrink-0 flex items-center justify-between px-2 select-none border-b border-[--panel-border] cursor-grab active:cursor-grabbing"
  (mousedown)="onDragStart($event)"
  (dblclick)="onMaximize($event)">
  <div class="flex items-center gap-2">
    <!-- Traffic Light Buttons -->
    <button (click)="onClose($event)" [attr.aria-label]="'Close / Cerrar: ' + title()" class="w-3.5 h-3.5 rounded-full bg-red-500 hover:bg-red-600 cursor-pointer border border-black/10"></button>
    <div class="w-3.5 h-3.5 rounded-full bg-yellow-500 border border-black/10"></div>
    <button (click)="onMaximize($event)" [attr.aria-label]="'Maximize / Restaurar: ' + title()" class="w-3.5 h-3.5 rounded-full bg-green-500 hover:bg-green-600 cursor-pointer flex items-center justify-center border border-black/10">
       @if (!isMaximized()) {
          <!-- Maximize Icon -->
          <svg class="w-2 h-2 text-black/40" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.5" fill="none">
              <rect x="1.5" y="1.5" width="7" height="7" rx="1"/>
          </svg>
      } @else {
          <!-- Restore Icon -->
          <svg class="w-2 h-2 text-black/40" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2" fill="none">
              <rect x="3.5" y="1.5" width="5" height="5" rx="1"/>
              <path d="M5.5 3.5 V 2.5 A 1 1 0 0 0 4.5 1.5 H 1.5 A 1 1 0 0 0 0.5 2.5 V 5.5 A 1 1 0 0 0 1.5 6.5 H 2.5"/>
          </svg>
      }
    </button>
  </div>
  <h2 class="font-mono-vt text-lg text-zinc-700 dark:text-gray-300">{{ title() }}</h2>
  <div class="w-16"></div> <!-- Spacer -->
</div>

<!-- Content -->
<div class="window-content flex-grow p-4 overflow-auto">
  <ng-content></ng-content>
</div>

<!-- Resize Handle -->
<div 
  class="absolute bottom-0 right-0 w-4 h-4 cursor-se-resize z-10"
  (mousedown)="onResizeStart($event)">
</div>
