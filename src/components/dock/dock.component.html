
<div class="dock-wrapper">
  <div class="dock-inner flex items-center justify-center gap-2 bg-[--dock-bg] border border-[--panel-border] backdrop-blur-md rounded-xl p-2 shadow-lg">
    @for(item of dockItems(); track item.id) {
      <button 
        (click)="onDockItemClick(item.id)"
        class="dock-button relative flex items-center justify-center rounded-lg transition-all duration-200 hover:bg-[--dock-hover-bg] transform hover:-translate-y-2 group"
        [attr.aria-label]="item.label" [attr.aria-pressed]="isWindowOpen(item.id)">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[--dock-icon]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.iconPath" />
        </svg>
        <span class="absolute -top-8 bg-[--bg-panel] text-[--text-primary] text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 group-focus-visible:opacity-100 transition-opacity pointer-events-none border border-[--panel-border] shadow-lg font-mono-vt text-base">{{ item.label }}</span>
        
        <!-- Active indicator -->
        @if(isWindowOpen(item.id)) {
          <div class="absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[--accent] rounded-full"></div>
        }
      </button>
    }
  </div>
</div>
