
<div class="space-y-6">
  @for (entry of educationHistory(); track entry.degree) {
    <div>
      <h3 class="text-lg text-[--accent] font-bold min-h-6 flex items-center">
        <app-typewriter [text]="entry.degree"></app-typewriter>
      </h3>
      <p class="text-gray-700 dark:text-gray-300">{{ entry.institution }}</p>
      <p class="font-mono-vt text-sm text-gray-500 dark:text-gray-400">{{ entry.period }} | {{ entry.location }}</p>
    </div>
  }
</div>
